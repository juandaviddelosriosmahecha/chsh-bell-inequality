[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-chsh"
version = "2.0.0"
description = "Beyond CHSH: experimental correlator-level analysis of quantum randomness under superconducting hardware noise"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Juan David de los Rios Mahecha" }]
keywords = ["quantum", "CHSH", "Bell inequality", "randomness", "Qiskit", "nonlocality"]

# Core scientific dependencies.
# The physics/analysis layer (probabilities, correlators, entropy, statistics)
# depends ONLY on numpy/scipy so it can be installed and tested without Qiskit.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Qiskit backends. Versions pinned to match the validated v1.0.0 toolchain.
# NOTE: API usage against these exact versions must be verified against the
# official Qiskit / qiskit-ibm-runtime documentation before a hardware run.
quantum = [
    "qiskit==2.3.1",
    "qiskit-aer==0.17.2",
    "qiskit-ibm-runtime==0.45.1",
    "pylatexenc==2.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
beyond-chsh = "beyond_chsh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that require IBM Quantum credentials (deselected by default)",
    "qiskit: tests that require the optional 'quantum' extra to be installed",
]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
